<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Streamer Overlay Wide</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@800&display=swap');

        body {
            background: transparent;
            margin: 0;
            padding: 10px;
            font-family: 'Kanit', sans-serif;
        }

        .stream-bar {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border-left: 5px solid #ff00ff;
            display: flex;
            align-items: center;
            color: white;
            padding: 0 20px;
            height: 50px;
            border-radius: 4px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        .title {
            color: #ff00ff;
            font-size: 14px;
            margin-right: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stats {
            display: flex;
            gap: 25px;
            font-size: 20px;
        }

        .s-win {
            color: #00ffaa;
        }

        .s-draw {
            color: #ffff00;
        }

        .s-loss {
            color: #ff4444;
        }

        .sep {
            color: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>
    <div class="stream-bar">
        <div class="title">Session Record</div>
        <div class="stats">
            <span class="s-win">W: <span id="wins">0</span></span>
            <span class="sep">/</span>
            <span class="s-draw">D: <span id="draws">0</span></span>
            <span class="sep">/</span>
            <span class="s-loss">L: <span id="losses">0</span></span>
        </div>
    </div>

    <script>
        async function updateStats() {
            try {
                const res = await fetch("/summary_stats.json?_=" + new Date().getTime());
                const data = await res.json();
                document.getElementById("wins").textContent = data[0];
                document.getElementById("draws").textContent = data[1];
                document.getElementById("losses").textContent = data[2];
            } catch (e) { }
        }
        updateStats();
        setInterval(updateStats, 5000);
    </script>
</body>

</html>
