<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Minimalist Light</title>
    <style>
        body {
            background: white;
            color: #1d1d1f;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            padding: 20px;
            display: flex;
        }

        .container {
            background: #f5f5f7;
            border-radius: 18px;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .value {
            font-size: 24px;
            font-weight: 600;
        }

        .label {
            font-size: 11px;
            color: #86868b;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .dot {
            width: 4px;
            height: 4px;
            border-radius: 2px;
            background: #d2d2d7;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="stat">
            <span class="label">Wins</span>
            <span id="wins" class="value">0</span>
        </div>
        <div class="dot"></div>
        <div class="stat">
            <span class="label">Draws</span>
            <span id="draws" class="value">0</span>
        </div>
        <div class="dot"></div>
        <div class="stat">
            <span class="label">Losses</span>
            <span id="losses" class="value">0</span>
        </div>
    </div>

    <script>
        async function updateStats() {
            try {
                const res = await fetch("/summary_stats.json?_=" + new Date().getTime());
                const data = await res.json();
                document.getElementById("wins").textContent = data[0];
                document.getElementById("draws").textContent = data[1];
                document.getElementById("losses").textContent = data[2];
            } catch (e) { }
        }
        updateStats();
        setInterval(updateStats, 5000);
    </script>
</body>

</html>
