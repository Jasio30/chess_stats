<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fantasy RPG Scroll</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:ital,wght@0,700;1,400&display=swap');
        body { background: transparent; padding: 20px; font-family: 'Cinzel', serif; }
        .scroll { background: #fdf5e6; border: 4px solid #8b4513; border-radius: 10px; padding: 25px 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 50px rgba(139,69,19,0.2); display: inline-block; position: relative; }
        .title { text-align: center; color: #8b0000; font-size: 24px; font-weight: bold; border-bottom: 2px solid #cd853f; padding-bottom: 10px; margin-bottom: 20px; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
        .grid { display: flex; gap: 40px; justify-content: center; }
        .stat { text-align: center; }
        .lbl { font-size: 14px; color: #5c4033; display: block; font-weight: bold; margin-bottom: 5px; }
        .val { font-size: 32px; color: #000; text-shadow: 1px 1px 0 #daa520; }
        .val-w { color: #006400; }
        .val-l { color: #8b0000; }
        .val-r { color: #483d8b; }
        .chg-val { font-size: 14px; margin-left: 5px; }
        .chg-pos { color: #006400; }
        .chg-neg { color: #8b0000; }
    </style>
</head>
<body>
    <div class="scroll">
        <div class="title">⚔️ Session Chronicle ⚔️</div>
        <div class="grid">
            <div class="stat"><span class="lbl">Victories</span><span id="wins" class="val val-w">0</span></div>
            <div class="stat"><span class="lbl">Stalemates</span><span id="draws" class="val">0</span></div>
            <div class="stat"><span class="lbl">Defeats</span><span id="losses" class="val val-l">0</span></div>
            <div class="stat"><span class="lbl">Elo Power</span><span class="val val-r"><span id="rating">----</span></span><span id="rating-change" class="chg-val"></span></div>
        </div>
    </div>
    <script>
        async function updateStats() {
            try {
                const res = await fetch("/summary_stats.json?_=" + new Date().getTime());
                const data = await res.json();
                document.getElementById("wins").textContent = data[0];
                document.getElementById("draws").textContent = data[1];
                document.getElementById("losses").textContent = data[2];
                if(data.length > 3 && data[3] > 0) {
                    document.getElementById("rating").textContent = data[3];
                    let chg = data[4] || 0;
                    let el = document.getElementById("rating-change");
                    el.textContent = chg > 0 ? "(+" + chg + ")" : (chg < 0 ? "(" + chg + ")" : "");
                    el.className = "chg-val " + (chg > 0 ? "chg-pos" : "chg-neg");
                }
            } catch (e) { }
        }
        updateStats(); setInterval(updateStats, 5000);
    </script>
</body>
</html>
