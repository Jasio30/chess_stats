<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Anime Cute</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&display=swap');

        body {
            background: transparent;
            padding: 20px;
            font-family: 'Fredoka', sans-serif;
        }

        .bubble {
            background: #fffafa;
            border: 4px solid #ffc0cb;
            border-radius: 30px;
            padding: 20px;
            display: inline-block;
            box-shadow: 0 10px 0 #ffc0cb;
            position: relative;
        }

        .header {
            color: #ff69b4;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }

        .stats-row {
            display: flex;
            gap: 15px;
        }

        .item {
            background: #fff;
            border-radius: 15px;
            padding: 10px 15px;
            text-align: center;
            border: 2px solid #ffebf0;
        }

        .val {
            font-size: 24px;
            font-weight: 700;
            color: #ff69b4;
        }

        .lbl {
            font-size: 10px;
            color: #ffb6c1;
            text-transform: uppercase;
            display: block;
        }
    </style>
</head>

<body>
    <div class="bubble">
        <div class="header">Game Results ✨</div>
        <div class="stats-row">
            <div class="item"><span class="lbl">Wins</span><span id="wins" class="val">0</span></div>
            <div class="item"><span class="lbl">Draws</span><span id="draws" class="val">0</span></div>
            <div class="item"><span class="lbl">Losses</span><span id="losses" class="val">0</span></div>
        </div>
    </div>

    <script>
        async function updateStats() {
            try {
                const res = await fetch("/summary_stats.json?_=" + new Date().getTime());
                const data = await res.json();
                document.getElementById("wins").textContent = data[0];
                document.getElementById("draws").textContent = data[1];
                document.getElementById("losses").textContent = data[2];
            } catch (e) { }
        }
        updateStats();
        setInterval(updateStats, 5000);
    </script>
</body>

</html>
