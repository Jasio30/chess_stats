<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Premium Glass</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: transparent;
            margin: 0;
            padding: 20px;
            font-family: 'Outfit', sans-serif;
            color: white;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            display: inline-grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .item {
            text-align: center;
        }

        .count {
            font-size: 48px;
            font-weight: 700;
            display: block;
            margin-bottom: 5px;
        }

        .label {
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.6;
        }

        .w {
            color: #00ffaa;
            text-shadow: 0 0 20px rgba(0, 255, 170, 0.4);
        }

        .d {
            color: #ffdd44;
            text-shadow: 0 0 20px rgba(255, 221, 68, 0.4);
        }

        .l {
            color: #ff4466;
            text-shadow: 0 0 20px rgba(255, 68, 102, 0.4);
        }

        .footer {
            grid-column: span 3;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 15px;
            font-size: 10px;
            opacity: 0.5;
            text-align: right;
        }
    </style>
</head>

<body>
    <div class="glass">
        <div class="item"><span id="wins" class="count w">0</span><span class="label">Wins</span></div>
        <div class="item"><span id="draws" class="count d">0</span><span class="label">Draws</span></div>
        <div class="item"><span id="losses" class="count l">0</span><span class="label">Losses</span></div>
        <div class="footer">LIVE SERVER SYNC ACTIVE // <span id="updated">--:--:--</span></div>
    </div>

    <script>
        async function updateStats() {
            try {
                const res = await fetch("/summary_stats.json?_=" + new Date().getTime());
                const data = await res.json();
                document.getElementById("wins").textContent = data[0];
                document.getElementById("draws").textContent = data[1];
                document.getElementById("losses").textContent = data[2];
                document.getElementById("updated").textContent = new Date().toLocaleTimeString();
            } catch (e) { }
        }
        updateStats();
        setInterval(updateStats, 5000);
    </script>
</body>

</html>
